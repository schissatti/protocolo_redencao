# ==================================================
# CONFIGURAÇÃO NGINX PARA AAPANEL (STREAMING DE VÍDEOS MP4 & EBOOKS)
# Cole esta configuração no Nginx do seu domínio no aaPanel
# ==================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name seudominio.com.br www.seudominio.com.br;
    
    # Diretório raiz do site no VPS (aaPanel)
    root /www/wwwroot/seudominio.com.br;
    index selecao.html index.html membros.html;

    # Suporte nativo para streaming de vídeos MP4 (sem travamentos ou lag)
    location ~* \.(mp4|m4v|webm|ogg)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache de Alta Performance para Ebooks PDF, Imagens e Estilos
    location ~* \.(pdf|jpg|jpeg|png|gif|ico|svg|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
